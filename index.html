<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Champions Dream — Túneles LED</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Champions Dream">
<meta name="theme-color" content="#07090f">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { background: #07090f; }
:root {
  --bg: #07090f;
  --surface: #0e1118;
  --surface2: #151a24;
  --border: #1c2133;
  --border2: #252d40;
  --text: #e8eaf0;
  --muted: #4a5270;
  --accent: #e8c840;
  --accent2: #1a6fff;
  --accent-dim: rgba(232,200,64,0.08);
  --red: #e83040;
  --green: #20d060;
  --radius: 13px;
  --font: 'DM Mono', monospace;
  --display: 'Bebas Neue', sans-serif;
}
body { background:var(--bg); color:var(--text); font-family:var(--font); min-height:100vh; padding-bottom:60px; max-width:500px; margin:0 auto; }

/* Header */
.hdr { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:50; }
.hdr img { height:32px; width:auto; }
.hdr-title { font-family:var(--display); font-size:18px; letter-spacing:2px; flex:1; color:var(--accent); }
.cfg-btn { background:none; border:1px solid var(--border2); color:var(--muted); font-family:var(--font); font-size:10px; padding:5px 10px; border-radius:6px; cursor:pointer; letter-spacing:1px; text-transform:uppercase; transition:all .15s; }
.cfg-btn:hover { border-color:var(--accent); color:var(--accent); }

/* Config */
.cfg { background:var(--surface); border-bottom:1px solid var(--border); padding:12px 16px; display:none; }
.cfg.open { display:block; }
.cfg h3 { font-size:9px; text-transform:uppercase; letter-spacing:2px; color:var(--muted); margin-bottom:10px; }
.ip-row { display:grid; grid-template-columns:72px 1fr; align-items:center; gap:8px; margin-bottom:6px; }
.ip-row label { font-size:11px; color:var(--muted); }
.ip-row input { background:var(--bg); border:1px solid var(--border2); border-radius:6px; color:var(--text); font-family:var(--font); font-size:12px; padding:6px 10px; width:100%; outline:none; }
.ip-row input:focus { border-color:var(--accent); }
.save-btn { margin-top:10px; background:var(--accent); color:#000; border:none; border-radius:6px; font-family:var(--font); font-size:11px; font-weight:500; padding:7px 14px; cursor:pointer; }

/* Global bar */
.gbar { display:flex; gap:6px; padding:12px 16px; border-bottom:1px solid var(--border); }
.gbtn { flex:1; background:var(--surface); border:1px solid var(--border2); border-radius:10px; color:var(--text); font-family:var(--font); font-size:10px; padding:8px 4px; cursor:pointer; transition:all .15s; text-transform:uppercase; letter-spacing:.8px; text-align:center; }
.gbtn:hover { border-color:var(--accent); color:var(--accent); }
.gbtn.active { background:var(--accent); color:#000; border-color:var(--accent); }

/* Tunnel tabs */
.ttabs { display:flex; border-bottom:1px solid var(--border); }
.ttab { flex:1; padding:11px; text-align:center; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; transition:all .15s; }
.ttab.active { color:var(--accent); border-bottom-color:var(--accent); }

/* Tunnel panel */
.tpanel { display:none; padding:16px; }
.tpanel.active { display:block; }

/* Power */
.prow { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.pinfo { display:flex; align-items:center; gap:8px; }
.sdot { width:7px; height:7px; border-radius:50%; background:var(--border2); transition:background .3s; }
.sdot.on { background:var(--green); box-shadow:0 0 8px var(--green); }
.plabel { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
.toggle { width:48px; height:26px; background:var(--border2); border-radius:13px; position:relative; cursor:pointer; border:none; outline:none; transition:background .2s; }
.toggle.on { background:var(--green); }
.toggle::after { content:''; position:absolute; width:20px; height:20px; background:#fff; border-radius:50%; top:3px; left:3px; transition:transform .2s; }
.toggle.on::after { transform:translateX(22px); }

/* Brightness */
.crow { margin-bottom:16px; }
.clabel { display:flex; justify-content:space-between; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
.clabel b { color:var(--text); font-weight:400; }
input[type=range] { -webkit-appearance:none; width:100%; height:3px; border-radius:2px; background:var(--border2); outline:none; cursor:pointer; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--accent); cursor:pointer; transition:transform .1s; }
input[type=range]:active::-webkit-slider-thumb { transform:scale(1.25); }

/* Segments */
.seg-label { font-size:9px; text-transform:uppercase; letter-spacing:2px; color:var(--muted); margin-bottom:8px; }
.seg-row { display:flex; gap:6px; margin-bottom:16px; }
.seg-btn { flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--muted); font-family:var(--font); font-size:10px; padding:7px 4px; cursor:pointer; transition:all .15s; text-align:center; text-transform:uppercase; letter-spacing:.5px; }
.seg-btn:hover { border-color:var(--border2); color:var(--text); }
.seg-btn.active { border-color:var(--accent); color:var(--accent); background:var(--accent-dim); }

/* Mode tabs */
.mtabs { display:flex; gap:6px; margin-bottom:16px; }
.mtab { flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--muted); font-family:var(--font); font-size:10px; padding:8px 4px; cursor:pointer; transition:all .15s; text-align:center; text-transform:uppercase; letter-spacing:.5px; }
.mtab:hover { color:var(--text); }
.mtab.active { border-color:var(--accent); color:var(--accent); background:var(--accent-dim); }

/* Mode panels */
.mpanel { display:none; }
.mpanel.active { display:block; }

/* Search */
.srchwrap { position:relative; margin-bottom:8px; }
.srch { width:100%; background:var(--surface2); border:1px solid var(--border2); border-radius:10px; color:var(--text); font-family:var(--font); font-size:13px; padding:9px 14px 9px 34px; outline:none; transition:border-color .15s; }
.srch:focus { border-color:var(--accent); }
.srch-ic { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:13px; pointer-events:none; }

/* Team grid */
.tgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:5px; max-height:220px; overflow-y:auto; margin-bottom:14px; padding-right:2px; }
.tgrid::-webkit-scrollbar { width:3px; }
.tgrid::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }
.tbtn { display:flex; align-items:center; gap:7px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:7px 9px; cursor:pointer; transition:all .12s; }
.tbtn:hover { border-color:var(--border2); }
.tbtn.sel { border-color:var(--accent); background:var(--accent-dim); }
.fdots { display:flex; flex-direction:column; gap:2px; flex-shrink:0; }
.fdot { width:18px; height:5px; border-radius:1px; }
.tname { font-size:11px; color:var(--text); line-height:1.2; }

/* Selected display */
.seldisplay { background:var(--surface2); border:1px solid var(--border2); border-radius:10px; padding:11px 13px; margin-bottom:14px; display:none; align-items:center; gap:10px; }
.seldisplay.vis { display:flex; }
.selname { font-family:var(--display); font-size:20px; letter-spacing:1px; flex:1; }
.selcols { display:flex; gap:4px; }
.cpill { width:20px; height:20px; border-radius:50%; }
.clrbtn { background:none; border:none; color:var(--muted); cursor:pointer; font-size:18px; line-height:1; }

/* Effects */
.fxgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; margin-bottom:6px; }
.fxbtn { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:9px 8px; cursor:pointer; transition:all .12s; text-align:left; }
.fxbtn:hover { border-color:var(--border2); }
.fxbtn.active { border-color:var(--accent); background:var(--accent-dim); }
.fxprev { display:flex; gap:3px; margin-bottom:5px; }
.fxpip { height:4px; border-radius:2px; flex:1; }
.fxname { font-size:11px; color:var(--text); display:block; margin-bottom:1px; }
.fxdesc { font-size:10px; color:var(--muted); display:block; }

/* Manual */
.color-swatches { display:flex; gap:7px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
.sw { width:28px; height:28px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:transform .1s,border-color .1s; }
.sw:hover { transform:scale(1.1); }
.sw.active { border-color:var(--text); }
.sw-custom { width:28px; height:28px; border-radius:50%; border:2px solid var(--border2); cursor:pointer; overflow:hidden; position:relative; flex-shrink:0; }
.sw-custom input { position:absolute; width:200%; height:200%; top:-50%; left:-50%; border:none; cursor:pointer; opacity:0; }
.sw-custom::before { content:'+'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--muted); pointer-events:none; }

/* Events */
.evgrid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
.evbtn { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:14px 10px; cursor:pointer; transition:all .15s; text-align:center; }
.evbtn:hover { border-color:var(--border2); transform:translateY(-1px); }
.evicon { font-size:24px; display:block; margin-bottom:6px; }
.evname { font-family:var(--display); font-size:16px; letter-spacing:1px; display:block; color:var(--text); }
.evdesc { font-size:10px; color:var(--muted); display:block; margin-top:2px; }
.evbtn.gol { border-color:rgba(232,200,64,.3); }
.evbtn.gol:hover { border-color:var(--accent); background:rgba(232,200,64,.08); }
.evbtn.salida { border-color:rgba(26,111,255,.3); }
.evbtn.salida:hover { border-color:var(--accent2); background:rgba(26,111,255,.08); }
.evbtn.victoria { border-color:rgba(32,208,96,.3); }
.evbtn.victoria:hover { border-color:var(--green); background:rgba(32,208,96,.08); }
.evbtn.inicio { border-color:rgba(232,48,64,.3); }
.evbtn.inicio:hover { border-color:var(--red); background:rgba(232,48,64,.08); }

/* Mode btn */
.mode-btn { flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:7px; color:var(--muted); font-family:var(--font); font-size:10px; padding:7px 4px; cursor:pointer; transition:all .15s; text-align:center; }
.mode-btn:hover { border-color:var(--border2); color:var(--text); }
.mode-btn.active { border-color:var(--accent); color:var(--accent); background:var(--accent-dim); }

/* Divider */
.div { height:1px; background:var(--border); margin:14px 0; }
.slabel { font-size:9px; text-transform:uppercase; letter-spacing:2px; color:var(--muted); margin-bottom:8px; }

/* Toast */
.toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(60px); background:var(--surface); border:1px solid var(--border2); border-radius:8px; padding:8px 16px; font-size:11px; color:var(--muted); transition:transform .2s; pointer-events:none; white-space:nowrap; z-index:200; }
.toast.show { transform:translateX(-50%) translateY(0); }
.toast.ok { color:var(--green); border-color:rgba(32,208,96,.3); }
.toast.err { color:var(--red); border-color:rgba(232,48,64,.3); }
.toast.ev { color:var(--accent); border-color:rgba(232,200,64,.3); }

/* ── Splash ── */
#splash {
  position: fixed;
  inset: 0;
  background: #07090f;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity .6s ease, transform .6s ease;
}
#splash.hide {
  opacity: 0;
  transform: scale(1.04);
  pointer-events: none;
}
.splash-logo {
  opacity: 0;
  transform: scale(.7);
  animation: splashIn .7s cubic-bezier(.22,1,.36,1) .2s forwards;
}
.splash-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px;
  letter-spacing: 5px;
  color: #f0e8d0;
  margin-top: 20px;
  opacity: 0;
  transform: translateY(12px);
  animation: splashFadeUp .6s ease .7s forwards;
}
.splash-sub {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #4a5270;
  margin-top: 8px;
  opacity: 0;
  animation: splashFadeUp .5s ease 1s forwards;
}
.splash-bar {
  width: 48px;
  height: 2px;
  background: var(--border2);
  border-radius: 2px;
  margin-top: 40px;
  overflow: hidden;
  opacity: 0;
  animation: splashFadeUp .4s ease 1.1s forwards;
}
.splash-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #facc00, #ffff00, #facc00);
  border-radius: 2px;
  animation: splashLoad 1s ease 1.2s forwards;
}
@keyframes splashIn {
  to { opacity:1; transform:scale(1); }
}
@keyframes splashFadeUp {
  to { opacity:1; transform:translateY(0); }
}
@keyframes splashLoad {
  to { width:100%; }
}
</style>
</head>

// ── WLED API ──
function hexToRgb(hex){
  const h=hex.replace('#','');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}

async function wledSend(tunnel, payload){
  const ip=ips[tunnel];
  if(!ip){ showToast(`IP del Túnel ${tunnel} no configurada`,'err'); return; }
  try {
    await fetch(`http://${ip}/json/state`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),mode:'cors'});
  } catch(e){ showToast(`Túnel ${tunnel}: sin conexión`,'err'); }
}

function buildPayload(tunnel, colors, fxId, on){
  const s = state[tunnel];
  const fx = EFFECTS.find(e=>e.id===fxId)||EFFECTS[0];
  const cols = colors.map(hexToRgb);
  while(cols.length<3) cols.push(cols[cols.length-1]||[0,0,0]);

  if(s.seg==='all'){
    return { on: on!==undefined?on:s.on, bri:s.bri, seg:[{start:0,stop:LED_COUNT,fx:fx.wledFx,col:cols.slice(0,3),sx:150,ix:150}] };
  } else {
    const [start,stop]=SEG_RANGES[s.seg];
    return { on: on!==undefined?on:s.on, bri:s.bri, seg:[{start,stop,fx:fx.wledFx,col:cols.slice(0,3),sx:150,ix:150}] };
  }
}

function doSend(tunnel, payload){
  if(synced){ wledSend('A',payload); wledSend('B',payload); }
  else { wledSend(tunnel,payload); }
}

  const on=!state[t].on;

}
function applyPower(t,on){
  state[t].on=on;
  document.getElementById('tog'+t).classList.toggle('on',on);
  document.getElementById('dot'+t).classList.toggle('on',on);
  document.getElementById('status'+t).textContent=on?'Encendido':'Apagado';
  wledSend(t,{on});
}
function allOff(){ applyPower('A',false); applyPower('B',false); }

function onBri(t,v){ document.getElementById('briVal'+t).textContent=v; state[t].bri=parseInt(v); }

  if(synced){
    ['A','B'].forEach(x=>{ document.getElementById('bri'+x).value=bri; document.getElementById('briVal'+x).textContent=bri; state[x].bri=bri; wledSend(x,{bri}); });

}

// ── Teams ──
function renderTeams(t, type, filter){
  const list = type==='selec' ? SELECCIONES : CLUBES;
  const filtered = list.filter(x=>x.name.toLowerCase().includes((filter||'').toLowerCase()));
  const grid = document.getElementById(`tgrid${t}_${type}`);
  const selTeam = type==='selec' ? state[t].team : state[t].clubTeam;
  grid.innerHTML = filtered.map(team=>{
    const dots = team.flag.map(c=>`<div class="fdot" style="background:${c}"></div>`).join('');
    const sel = selTeam?.name===team.name ? 'sel' : '';
    return `<button class="tbtn ${sel}" onclick="selectTeam('${t}','${type}','${team.name}')">
      <div class="fdots">${dots}</div>
      <span class="tname">${team.name}</span>
    </button>`;
  }).join('');
}

function selectTeam(t, type, name){
  const list = type==='selec' ? SELECCIONES : CLUBES;
  const team = list.find(x=>x.name===name);
  if(!team) return;
  if(synced){ applyTeam('A',type,team); applyTeam('B',type,team); }
  else { applyTeam(t,type,team); }
  renderTeams(t,type, document.getElementById(`srch${t}_${type}`).value);
  if(synced && t==='A'){ renderTeams('B',type, document.getElementById(`srch${'B'}_${type}`).value); }
}

function applyTeam(t, type, team){
  if(type==='selec') state[t].team=team;
  else state[t].clubTeam=team;

  const suffix = type==='selec' ? '' : 'C';
  const disp = document.getElementById(`seld${suffix}${t}`);
  disp.classList.add('vis');
  document.getElementById(`seldname${suffix}${t}`).textContent=team.name;
  document.getElementById(`seldcols${suffix}${t}`).innerHTML=team.flag.map(c=>`<div class="cpill" style="background:${c}"></div>`).join('');

  // render effects with team colors
  if(type==='selec') renderEffects(t, team);
  else renderClubEffects(t, team);

  // send
  const fxId = type==='selec' ? state[t].fx : (state[t].clubFx||'solid');
  const payload = buildPayload(t, team.flag, fxId, true);
  state[t].on=true;
  document.getElementById('tog'+t).classList.add('on');
  document.getElementById('dot'+t).classList.add('on');
  document.getElementById('status'+t).textContent='Encendido';
  wledSend(t, payload);
  showToast(team.name,'ok');
}

function clearTeam(t){
  state[t].team=null;
  document.getElementById('seld'+t).classList.remove('vis');
  renderTeams(t,'selec','');
}
function clearTeamC(t){
  state[t].clubTeam=null;
  document.getElementById('seldC'+t).classList.remove('vis');
  renderTeams(t,'club','');
}

// ── Effects (selec) ──
function renderEffects(t, team){
  const colors = team ? team.flag : ['#555','#888','#aaa'];
  const grid = document.getElementById('fxgrid'+t);
  grid.innerHTML = EFFECTS.map(fx=>{
    const pips = fx.pip.map((w,i)=>{
      const c=colors[i%colors.length]||'#555';
      return `<div class="fxpip" style="background:${c};opacity:${w}"></div>`;
    }).join('');
    const active = state[t].fx===fx.id ? 'active' : '';
    return `<button class="fxbtn ${active}" onclick="selectFx('${t}','selec','${fx.id}')">
      <div class="fxprev">${pips}</div>
      <span class="fxname">${fx.name}</span>
      <span class="fxdesc">${fx.desc}</span>
    </button>`;
  }).join('');
}

function renderClubEffects(t, team){
  const colors = team ? team.flag : ['#555','#888','#aaa'];
  const grid = document.getElementById('fxgridC'+t);
  grid.innerHTML = EFFECTS.map(fx=>{
    const pips = fx.pip.map((w,i)=>{
      const c=colors[i%colors.length]||'#555';
      return `<div class="fxpip" style="background:${c};opacity:${w}"></div>`;
    }).join('');
    const active = (state[t].clubFx||'solid')===fx.id ? 'active' : '';
    return `<button class="fxbtn ${active}" onclick="selectFx('${t}','club','${fx.id}')">
      <div class="fxprev">${pips}</div>
      <span class="fxname">${fx.name}</span>
      <span class="fxdesc">${fx.desc}</span>
    </button>`;
  }).join('');
}

function selectFx(t, type, fxId){
  if(type==='selec'){
    state[t].fx=fxId;
    renderEffects(t, state[t].team);
    if(state[t].team){ const p=buildPayload(t,state[t].team.flag,fxId,true); doSend(t,p); }
  } else if(type==='club'){
    state[t].clubFx=fxId;
    renderClubEffects(t, state[t].clubTeam);
    if(state[t].clubTeam){ const p=buildPayload(t,state[t].clubTeam.flag,fxId,true); doSend(t,p); }
  } else {
    state[t].manualFx=fxId;
    renderManualFx(t);
    sendManual(t);
  }
}

function renderSwatches(t){
  const cont = document.getElementById('swatches'+t);

    return `<div class="sw ${active}" style="background:${c}" onclick="setManualColor('${t}','${hex}',this)"></div>`;

  `<div class="sw-custom"><input type="color" value="#ffffff" onchange="setManualColorHex('${t}',this.value)"></div>`;

      return `<div class="fxpip" style="background:${cols[i%cols.length]};opacity:${w}"></div>`;
    }).join('');
    const active = (state[t].manualFx||'solid')===fx.id ? 'active' : '';

function setManualColor(t, hex, el){
  state[t].color=hex;
  document.querySelectorAll(`#swatches${t} .sw`).forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  renderManualFx(t);
  sendManual(t);
}
function setManualColorHex(t, hexFull){ setManualColor(t, hexFull.replace('#',''), null); renderManualFx(t); }

function sendManual(t){
  const fxId = state[t].manualFx||'solid';
  const p = buildPayload(t, ['#'+state[t].color,'#ffffff','#000000'], fxId, true);
  state[t].on=true;
  document.getElementById('tog'+t).classList.add('on');
  document.getElementById('dot'+t).classList.add('on');
  document.getElementById('status'+t).textContent='Encendido';
  doSend(t, p);
}

// ── Connection mode ──
const connMode = { A:'net', B:'net' };

function setConnMode(t, mode) {
  connMode[t] = mode;
  document.getElementById(`mode${t}_net`).classList.toggle('active', mode==='net');
  document.getElementById(`mode${t}_ap`).classList.toggle('active', mode==='ap');
  const hint = document.getElementById(`apHint${t}`);
  const input = document.getElementById('ip'+t);
  const tabLabel = document.getElementById('tabMode'+t);
  if(mode==='ap') {
    hint.style.display='block';
    input.value = '192.168.4.1';
    input.style.color = 'var(--accent)';
    if(tabLabel) { tabLabel.textContent='AP'; tabLabel.style.color='var(--accent)'; }
  } else {
    hint.style.display='none';
    input.value = ips[t] || '';
    input.style.color = '';
    if(tabLabel) { tabLabel.textContent='RED'; tabLabel.style.color=''; }
  }
}

// ── Ping ──
const PING_STATES = {}; // A: 'ok'|'err'|'checking'|'unknown'

async function pingTunnel(t) {
  const ip = ips[t];
  const dot = document.getElementById('pingDot'+t);
  
  if(!ip) {
    setPingState(t, 'unknown');
    return;
  }
  
  setPingState(t, 'checking');
  
  try {
    const ctrl = new AbortController();
    const timeout = setTimeout(()=>ctrl.abort(), 3000);
    const r = await fetch(`http://${ip}/json/info`, { signal: ctrl.signal, mode:'cors' });
    clearTimeout(timeout);
    if(r.ok) setPingState(t,'ok');
    else setPingState(t,'err');
  } catch(e) {
    setPingState(t,'err');
  }
}

function setPingState(t, state) {
  PING_STATES[t] = state;
  const dot = document.getElementById('pingDot'+t);
  const colors = { ok:'#20d060', err:'#e83040', checking:'#e8c840', unknown:'#383840' };
  const shadows = { ok:'0 0 8px #20d060', err:'0 0 8px #e83040', checking:'0 0 6px #e8c840', unknown:'none' };
  dot.style.background = colors[state] || colors.unknown;
  dot.style.boxShadow = shadows[state] || 'none';
  
  // Update ping status text in config
  const statusEl = document.getElementById('pingStatus');
  if(statusEl) {
    const msgs = [];
    ['A','B'].forEach(x => {
      const ip = ips[x];
      if(!ip) { msgs.push(`Túnel ${x}: sin IP`); return; }
      const s = PING_STATES[x];
      const labels = { ok:`Túnel ${x}: ✓ online (${ip})`, err:`Túnel ${x}: ✗ sin respuesta`, checking:`Túnel ${x}: comprobando...`, unknown:`Túnel ${x}: —` };
      msgs.push(labels[s]||labels.unknown);
    });
    statusEl.innerHTML = msgs.join('<br>');
  }
}

async function pingAll() {
  const btn = document.getElementById('pingBtn');
  btn.textContent = '...';
  btn.style.color = 'var(--accent)';
  await Promise.all([pingTunnel('A'), pingTunnel('B')]);
  btn.textContent = 'Ping';
  btn.style.color = '';
  
  const okA = PING_STATES.A==='ok', okB = PING_STATES.B==='ok';
  if(okA && okB) showToast('A ✓  B ✓  Ambos online','ok');
  else if(!okA && !okB) showToast('A ✗  B ✗  Sin conexión','err');
  else showToast(`${okA?'A ✓':'A ✗'}  ${okB?'B ✓':'B ✗'}`,'');
}

// Auto-ping on load after 1s if IPs are set
setTimeout(()=>{ if(ips.A||ips.B) pingAll(); }, 1000);

// ── Render all ──
// Apply saved conn modes to UI
['A','B'].forEach(t=>{
  if(connMode[t]==='ap') setConnMode(t,'ap');
});
['A','B'].forEach(t=>{
  renderTeams(t,'selec','');
  renderTeams(t,'club','');
  renderEffects(t);
  renderClubEffects(t);
  renderManualFx(t);
  renderEvents(t);
  document.getElementById('ipA').value=ips.A;
  document.getElementById('ipB').value=ips.B;
});

// ── Splash ──
window.addEventListener('load', () => {
  setTimeout(() => {
    const splash = document.getElementById('splash');
    splash.classList.add('hide');
    setTimeout(() => splash.remove(), 700);
  }, 2400);
});
</script>
